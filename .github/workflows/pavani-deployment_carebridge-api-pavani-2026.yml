name: Build and deploy Python app to Azure Web App - carebridge-api-pavani-2026

on:
  push:
    branches:
      - 'pavani-deployment'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: healthcare-management-system/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            healthcare-management-system/backend/
            !healthcare-management-system/backend/antenv/**
            !healthcare-management-system/backend/venv/**
            !healthcare-management-system/backend/uploads/**
            !healthcare-management-system/backend/**/__pycache__/**
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: backend-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EE614853A888442EB83EF2665BFC8D7C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4C95752C14EB482C860B402643DEE7A1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_32EF71A7C77545509C2DB77D17283776 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'carebridge-api-pavani-2026'
          slot-name: 'Production'
          package: backend-package
