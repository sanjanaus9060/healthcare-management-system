# Local development only. Copy backend/.env.example to backend/.env and fill in values first.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      CORS_ORIGINS: http://localhost:3000
      PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
