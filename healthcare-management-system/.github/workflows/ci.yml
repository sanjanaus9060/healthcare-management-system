name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend - install, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_BACKEND_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Run frontend tests
        run: CI=true yarn test --watchAll=false
      - name: Build frontend
        run: CI=false yarn build

  backend:
    name: Backend - install and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Run backend tests (in-memory MongoDB mock, no AI key needed)
        run: python -m pytest -q
      - name: Validate application imports
        env:
          TESTING: "1"
          DB_NAME: ci_check
          JWT_SECRET: ci-only-secret-value-0123456789abcdef
        run: python -c "import server; print('Routes:', len(server.app.routes))"
